name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No PYTHONUTF8 here on purpose: the bugs these tests cover only appear when the
      # script is left to the platform's default encoding, which is what a real user gets.
      - run: python -m unittest discover -s tests -v
